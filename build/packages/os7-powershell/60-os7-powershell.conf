# OS/7 - PowerShell does not look for its own updates. SESSION-QOL-SURVEY Q12.
#
# The desktop session's half of /etc/profile.d/95-os7-powershell.sh: that file
# reaches login shells, and this reaches what systemd's user manager starts for
# a graphical session - a terminal in VS Code, OS/7's own applications, anything
# launched from the Apps menu that runs pwsh. PowerShell is updated by
# Update-OS7 with the rest of the release, so its own check would only ever
# send a person somewhere this product does not want them to go.
POWERSHELL_UPDATECHECK=Off
# And no usage telemetry to Microsoft (CURATION-AND-DELIVERY-PLAN C17).
POWERSHELL_TELEMETRY_OPTOUT=1
