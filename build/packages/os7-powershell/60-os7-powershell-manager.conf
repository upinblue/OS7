# OS/7 - PowerShell does not call Microsoft from a SERVICE either (C17).
#
# /etc/profile.d/95-os7-powershell.sh and environment.d reach login shells and
# the desktop session; a system service inherits from neither, and six of
# OS/7's own units run pwsh - os7-update-check from a timer on every machine.
# Measured on 1.0.0.247: with this file and a daemon-reload, a unit started by
# systemd-run sees POWERSHELL_TELEMETRY_OPTOUT=1; without it, the same unit
# sees nothing. It takes effect at the next boot or daemon-reload, which on
# OS/7 is the first boot of the environment an update installed it into.
[Manager]
DefaultEnvironment=POWERSHELL_UPDATECHECK=Off POWERSHELL_TELEMETRY_OPTOUT=1
