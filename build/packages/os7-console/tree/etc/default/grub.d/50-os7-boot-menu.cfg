# OS/7 — the installed machine's boot menu (SESSION-QOL-SURVEY Q5 and
# docs/BRAND-PLAN.md BRL8, decided 2026-11-09). A CONFFILE of os7-console, read
# by update-grub after /etc/default/grub: an administrator who wants any of
# this back sets it here, and an update keeps their value. A fresh install
# reads it when Setup runs update-grub. A machine that UPDATES does not, at
# first: activation builds the new environment's menu from the RUNNING
# environment's configuration, which predates this file - so firstboot
# migration 81-boot-menu rebuilds the menu once the new environment runs
# (BUILD-NOTES #198, measured 1.0.0.272 -> 1.0.0.275). The colours are not
# here: /etc/grub.d/06_os7_theme says why.
#
# WHAT A 1.0.0.272 MACHINE'S MENU WAS, read out of /boot/grub/grub.cfg on one:
# Debian's blue colours, "OS/7 1.0.0 (preview)", "Advanced options for ...",
# EIGHT "Memory test" entries and "UEFI Firmware Settings" - and a 30-second
# wait.

# THE WAIT. Every EFI boot waited 30 seconds, whatever GRUB_TIMEOUT says.
# Ubuntu's /etc/grub.d/00_header, read in the image: when GRUB cannot write its
# environment - `recordfail_broken=1`, which is ZFS - it emits, on EFI,
#
#     set timeout=${GRUB_RECORDFAIL_TIMEOUT:-30}
#
# so that a failed boot can still be caught at the menu although it could not
# be recorded. The 1.0.0.272 machine's grub.cfg holds `set timeout=30` twice
# for exactly that, and a bench's menu said "executed automatically in 9s" 26
# seconds after it first drew. Setup's /etc/default/grub has said GRUB_TIMEOUT=5
# since the first install and was overruled on every boot. grub-mkconfig reads
# this directory and exports the variable (both read in the image), so this is
# all it takes.
#
# Five seconds is GRUB_TIMEOUT's own value, and still a window: the menu is
# shown (GRUB_TIMEOUT_STYLE=menu), so a person who needs the previous boot
# environment sees it and has time to choose it.
GRUB_RECORDFAIL_TIMEOUT=5

# THE MEMORY TESTS. memtest86+ adds an entry per binary per console - eight on
# an amd64 machine, x64 and ia32 alike - to a menu whose other entries are the
# operating system. memtest86+'s own script reads this switch out of this
# directory (its config_item, read in the image). The package stays installed,
# so a machine that needs the test gets it back by setting this to false.
GRUB_DISABLE_MEMTEST=true
