# /var/log on an OS/7 machine is a ZFS dataset (rpool/DATA/log, SETUP-PLAN
# §4.4) that systemd has no mount unit for — this image ships no
# /etc/zfs/zfs-list.cache, so zfs-mount-generator emits nothing and the
# unit's own RequiresMountsFor=/var/log/journal orders against nothing.
# Unordered, the flush wins the race on every boot: journald flushes the
# runtime journal into /var/log/journal on the BOOT ENVIRONMENT's root
# dataset, deletes it from /run, and `zfs mount -a` then mounts the real
# /var/log over everything it wrote and everything it keeps writing.
# The machine has a journald that reads active and a journalctl that says
# "No journal files were found" — on every boot. BUILD-NOTES #108.
[Unit]
After=zfs-mount.service
