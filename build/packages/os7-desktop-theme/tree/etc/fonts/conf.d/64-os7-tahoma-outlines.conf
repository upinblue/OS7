<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  OS/7 Classic: draw Tahoma from its OUTLINES, never from its embedded bitmaps.
  docs/BUILD-NOTES.md #171, which corrects #84.

  WHAT WAS BROKEN. Every GTK 4 / libadwaita window lost letters at the UI
  size: "Mult tasking", "Not fications", "Onl ne Accounts", with p drawn
  mirrored. Measured 2026-10-29 on an install from OS7-1.0.0.245-amd64.iso,
  one variable at a time, each with a freshly started gnome-control-center:
  hinting full or slight, broken; GSK_RENDERER=ngl, broken; GSK_RENDERER=cairo,
  correct; another font, correct.

  WHY. The Tahoma this package ships is Wine's, and it carries no hinting
  instructions at all but EMBEDDED BITMAP STRIKES at 8, 9, 10, 11, 12, 13, 15
  and 16 ppem (EBDT/EBLC, read with fontTools). Tahoma 9 at 96 dpi is 12 px,
  one of them. FreeType hands those bitmaps out in place of the outlines, and
  GTK 4's GPU glyph path draws them wrongly; cairo, which GTK 3 and the old
  GTK 4 renderer use, draws them correctly. The same file with the strikes
  removed rendered correctly through GTK 4's default renderer, and so did the
  UNCHANGED file with this rule in force.

  WHY A RULE AND NOT A MODIFIED FONT. tahoma.ttf is fetched by hash from the
  pinned archive (build-desktop-theme.sh), and an LGPL file shipped as it came
  is simpler to account for than a derived one. The rule leaves the file alone
  and changes what fontconfig asks FreeType for.

  WHAT IT COSTS. fontconfig cannot tell toolkits apart, so GTK 3 and the Shell
  draw Tahoma from outlines too, with the grayscale antialiasing
  00-os7-classic sets: softer than the pixel-exact strikes, and readable
  everywhere instead of crisp in half the windows and broken in the other
  half. Scoped to the family "Tahoma" alone; no other font is touched.
-->
<fontconfig>
  <match target="font">
    <test name="family" compare="eq"><string>Tahoma</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
