<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 128 128">
<!--
  OS/7 - THIS FILE IS NOT UBUNTU'S, AND THE NAME IS THE POINT.

  The <svg> element comes FIRST, before this comment, on purpose: the consumer
  loads it through GdkPixbuf, which decides whether a file is an SVG by sniffing
  a 256-byte prefix. A header comment above the element is how the login screen
  once came up empty (docs/BUILD-NOTES.md #111).

  gnome-control-center as Ubuntu builds it draws its Settings > System > About
  logo from two HARD-CODED paths, read out of the binary on an install from
  OS7-1.0.0.245-amd64.iso:

      /usr/share/pixmaps/ubuntu-logo-text.svg        light style
      /usr/share/pixmaps/ubuntu-logo-text-dark.svg   dark style

  and never from LOGO= in /etc/os-release, which is what upstream GNOME reads
  and which has said "os7" since 2026-08-26. So the About page showed a large
  Ubuntu wordmark above "Operating System: OS/7 1.0.0". docs/BUILD-NOTES.md #169.

  base-files owns both paths. os7-desktop-theme's preinst diverts base-files'
  files to *.distrib with dpkg-divert, and this file takes the name; postrm puts
  them back. A base-files upgrade then writes to the diverted name and leaves
  this one alone - the same mechanism hook 0035 uses for plymouth's
  bgrt-fallback.png, here owned by the package so that it reaches machines that
  are UPDATED as well as ones that are installed.

  The picture is the product mark, the same tile as
  /usr/share/icons/hicolor/scalable/apps/os7.svg (the icon LOGO= names), so the
  About page shows what upstream GNOME would have shown from LOGO=. The tile
  carries its own background, which is why the light and the dark file are the
  same picture. Colours from build/lib/palette.py: #0057ad FIELD, #1289ff BRAND.
-->
  <rect x="4" y="4" width="120" height="120" rx="16" ry="16" fill="#0057ad"/>
  <rect x="4" y="4" width="120" height="10" rx="5" ry="5" fill="#1289ff"/>
  <text x="64" y="86"
        font-family="DejaVu Sans, Verdana, sans-serif"
        font-size="44" font-weight="bold"
        text-anchor="middle" fill="#ffffff">OS/7</text>
</svg>
