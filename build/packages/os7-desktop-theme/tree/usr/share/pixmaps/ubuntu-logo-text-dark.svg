<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 128 128">
<!--
  OS/7 - the dark-style twin of ./ubuntu-logo-text.svg, which carries the full
  account: gnome-control-center hard-codes this path for its About page in dark
  style, base-files owns it, os7-desktop-theme diverts it. The tile has its own
  background, so the picture is the same in both styles.
  docs/BUILD-NOTES.md #169.
-->
  <rect x="4" y="4" width="120" height="120" rx="16" ry="16" fill="#0057ad"/>
  <rect x="4" y="4" width="120" height="10" rx="5" ry="5" fill="#1289ff"/>
  <text x="64" y="86"
        font-family="DejaVu Sans, Verdana, sans-serif"
        font-size="44" font-weight="bold"
        text-anchor="middle" fill="#ffffff">OS/7</text>
</svg>
