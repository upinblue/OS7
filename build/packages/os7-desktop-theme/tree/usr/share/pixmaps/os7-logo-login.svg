<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="216" height="98" viewBox="0 0 880 400">
<!--  OS/7 — the mark the LOGIN SCREEN shows, and the only thing that decides that
  it is shown is one dconf value:

      /org/gnome/login-screen/logo = '/usr/share/pixmaps/os7-logo-login.svg'

  set in /usr/share/gdm/dconf/95-os7-login-screen. Until it existed, GDM drew
  /usr/share/pixmaps/ubuntu-logo-text-dark.svg, named by
  10_ubuntu-settings.gschema.override, which ubuntu-settings owns and
  ubuntu-desktop-minimal Depends on - so it cannot be removed and must be
  OUT-RANKED instead. docs/BUILD-NOTES.md #110.

  WHY A SEPARATE FILE FROM os7.svg. That one is the ICON /etc/os-release's
  LOGO= names: square, 128x128, a blue tile meant to sit in an icon grid and in
  plymouth's 128px slot. A greeter logo is not an icon - it lands on a wide,
  empty strip below the user list, and a square tile there reads as a misplaced
  app icon.

  AND THE SIZE IS NOT A GUESS. gnome-shell's LoginDialog._updateLogoTexture,
  read out of libshell-18.so in the shipped image, calls

      load_file_sync(..., this._logoFile, -1, -1, scaleFactor, resourceScale)

  and -1, -1 is "natural size" - so what the screen shows is this file's own
  width/height attributes times the HiDPI scale factor, with the viewBox doing
  nothing but fixing the aspect ratio. Ubuntu's is 187x72; 216x98 is the same
  order and leaves the vendor mark below the rule about 100 px to work with.
  That is not enough for its 2.4-unit stripes to stay separate - they resolve
  into a soft frame at scale 1 and sharpen at scale 2, which is a property of
  the mark and not a defect here. Rendered at both before it shipped.

  THE INK IS WHITE because the greeter background is OS/7 blue (#0057ad, the
  Setup field colour), set in the same keyfile. The vendor mark below the rule
  is up in blue GmbH's, path for path, from upinblue-logo.svg beside this file
  - recoloured, not redrawn, because its own #417cbf against #0057ad is a
  contrast ratio of about 1.7:1. Change the background and this file's ink has
  to change with it; they are one decision written in two places, which is why
  both say so.

  THE WORDMARK IS <text>, NOT PATHS - the same trade os7.svg makes and for the
  same reason: a path version cannot be read or corrected by a human. Both
  renderers that see this file have DejaVu Sans (fonts-dejavu-core is in the
  image), and hook 0035 rasterises it with rsvg-convert at build time and
  fails the build if the result is not a PNG - so a substituted font is a
  build failure, not a login screen nobody looked at.

  GENERATED, and re-generatable: the 215 vendor paths below are
  `sed 's/ class="cls-1"//'` over upinblue-logo.svg's, in document order. Do
  not hand-edit them; edit the vendor file and regenerate.
  WHY THIS COMMENT IS INSIDE THE <svg> ELEMENT AND NOT ABOVE IT
  ==============================================================
  Because it was above it, and that blanked the login screen on a real machine
  (2026-08-29, docs/BUILD-NOTES.md #111).

  GdkPixbuf - which is what gnome-shell's St.TextureCache uses to load this
  file - decides whether a file is an image by SNIFFING A FIXED PREFIX, not by
  parsing it. Measured on the shipped image by binary search: `<svg` beginning
  at byte 256 loads, at byte 257 the loader answers "Couldn't recognize the
  image file format". A 35-line documentation header put it at byte 2764.

  What that does is not a missing logo. St.TextureCache.load_file_sync THROWS,
  inside LoginDialog._updateLogoTexture, while the dialog is being built - so
  the greeter came up with a background, a top bar, and no login dialog at all.

  So: `<?xml?>` then `<svg>` then prose. Anything that has to be said about
  this file gets said from here, below byte 256.
-->

  <!-- OS/7, the product. -->
  <text x="440" y="180"
        font-family="DejaVu Sans, Verdana, sans-serif"
        font-size="180" font-weight="bold"
        text-anchor="middle" fill="#ffffff">OS/7</text>

  <!-- The rule that separates product from vendor. -->
  <rect x="220" y="226" width="440" height="4" fill="#ffffff" opacity="0.55"/>

  <!-- up in blue GmbH, the vendor. 510.9 x 223.7 at scale 0.6 is 306.5 x 134.2,
       centred at x=(880-306.5)/2 and resting on the viewBox floor. -->
