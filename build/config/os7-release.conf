# =============================================================================
# OS/7 — the release pin. THE single source of truth for "what is this build".
#
# Sourced by:
#   build/config/auto/config           mirrors, ISO volume name
#   build/build.sh                     version string, ISO filename, manifest
#   build/config/hooks/*.hook.chroot   component pins (staged to
#                                      /usr/lib/os7/release.conf inside the image)
#
# docs/RELEASE-AND-UPDATE-PLAN.md is the design; this file is its instance.
# Nothing else in the repo may carry a version number or an archive URL.
#
# THE RULE THIS FILE EXISTS TO ENFORCE (release plan 3.1): a version number is
# only honest if the archive is pinned. `apt full-upgrade` against a live
# archive gives a different system depending on the day it ran, and two machines
# would then report the same number and hold different kernels. That is worse
# than having no number, because a number gets trusted.
# =============================================================================

# --- Product version (release plan 3.3) --------------------------------------
# Four fields, Windows-style: one product number plus a bill of materials, not
# one field per component.
#
#   MAJOR  Ubuntu LTS generation. 1.x = 26.04, 2.x = 28.04. Moves only on an
#          explicit generation migration - never automatically. This field is
#          NOT a maturity signal; maturity is OS7_CHANNEL below.
#   MINOR  OS/7 feature release on the same base: new cmdlets, new os7-setup.
#   PATCH  Maintenance train: Ubuntu security rollup plus fixes.
#   BUILD  Monotonic build counter. NOT set here - see below.
OS7_VERSION_MAJOR=1
OS7_VERSION_MINOR=0
OS7_VERSION_PATCH=0

# BUILD is derived, not written down: `git rev-list --count HEAD`, computed by
# build.sh. The release plan calls this "the CI build number", and this project
# has no CI by design (everything runs locally on one Mac). A hand-maintained
# counter in this file was the alternative and it is worse: two builds could
# carry one number and different bits, which is exactly what 3.1 forbids.
#
# The commit count is monotonic on a linear main, needs no state file, and can
# be recomputed from the repository alone years later. Its two honest limits are
# recorded in the manifest rather than hidden: a build from a branch is not
# comparable with one from main, and a DIRTY tree means the number does not
# identify the source. build.sh sets "reproducible": false for the latter and
# says so on stdout.

# --- Maturity ----------------------------------------------------------------
# stable | preview | development. Reported by Get-OS7Version and carried in the
# manifest. Nothing about OS/7 has shipped, so it is "development" - and it is
# this field that says so, not the MAJOR field.
OS7_CHANNEL="development"

# --- Base --------------------------------------------------------------------
# Ubuntu 26.04 LTS "Resolute Raccoon". Locked (README "Locked decisions").
OS7_DISTRIBUTION="resolute"
OS7_UBUNTU_RELEASE="26.04"

# The archive pin. Everything the Ubuntu half of this product contains is
# determined by this one timestamp plus the package selections.
#
# MEASURED 2026-08-24 against the live service, not remembered:
#
#   .../ubuntu/20260824T000000Z/dists/resolute/Release           200
#       Date: Thu, 23 Apr 2026 17:07:15 UTC   (the frozen release suite)
#   .../ubuntu/20260824T000000Z/dists/resolute-updates/Release   200
#       Date: Sun, 23 Aug 2026 23:58:59 UTC
#   .../ubuntu/20260824T000000Z/dists/resolute-security/Release  200
#       Date: Sun, 23 Aug 2026 23:58:45 UTC
#   .../dists/resolute/main/binary-arm64/Packages.gz             200, 1860484 B
#   .../dists/resolute/main/binary-amd64/Packages.gz             200
#
# So the timestamp resolves to an INSTANT, not a rounded day: this pin is the
# archive as it stood just before midnight on 2026-08-23.
#
# NOTE the second measurement above, which removes a special case rather than
# adding one: arm64 is served under the same /ubuntu/ path as amd64. The
# archive.ubuntu.com / ports.ubuntu.com split that auto/config used to branch on
# DOES NOT EXIST in the snapshot service.
OS7_ARCHIVE_SNAPSHOT="20260824T000000Z"
OS7_ARCHIVE_BASE="https://snapshot.ubuntu.com/ubuntu"

# --- Microsoft components (release plan 3.4) ---------------------------------
# packages.microsoft.com has NO snapshot service, so these cannot be pinned by
# URL the way the Ubuntu archive can. They are pinned by version AND hash and
# verified at build time - the pattern hook 0020 already used before this file
# existed, generalised rather than invented.
#
# Bump a version and its hashes together. A Microsoft component moving upstream
# is a release event, not a background occurrence.
OS7_PWSH_VERSION="7.6.5"
OS7_PWSH_SHA256_x64="b34ab3b19acac1d3d4d0d3cfdb02acf62f457b0b6a962ff008132033f7566844"
OS7_PWSH_SHA256_arm64="ed4084f215d8bce2edd23aa7cb1f1e7b0818e41363a635a22065d2701b6141df"

# Microsoft's APT signing keys, pinned by fingerprint (hook 0010). Two are
# required: Microsoft rotated in spring 2025 and the older repos still sign with
# the legacy key.
OS7_MSKEY_2025_FPR="AA86F75E427A19DD33346403EE4D7792F748182B"
OS7_MSKEY_LEGACY_FPR="BC528686B50D79E339D3721CEB3E94ADBE1229CF"

# --- Console fonts (SETUP-PLAN 2.3 and 2.8) ----------------------------------
# Two fonts, two decisions: Fixedsys Excelsior for os7-setup (D9), Cascadia Mono
# for the installed console (D15). Both are converted to PSF in the build
# container and only the PSFs reach the image.
#
# Cascadia comes from the ARCHIVE rather than from upstream, which is why it is
# pinned here by package version instead of by URL: it resolves under
# OS7_ARCHIVE_BASE/OS7_ARCHIVE_SNAPSHOT above, so there is no second domain and
# no second trust root. Upstream's only release asset is a 150 MB ZIP of every
# family x weight x format; the .deb is 1.3 MB and carries the same release.
#
# THE HASH OF THE TTF IS NOT REDUNDANT WITH THE HASH OF THE .deb. The same
# Cascadia version exists as a hinted static instance and as an unhinted
# variable font, and the two rasterise DIFFERENTLY - 106 of 132 sampled glyphs
# differ at 8x16 (BUILD-NOTES #53). What is pinned is the file that becomes
# pixels, not the release it came in.
OS7_CASCADIA_PACKAGE="fonts-cascadia-code"
OS7_CASCADIA_VERSION="2407.24-3"
OS7_CASCADIA_DEB_SHA256="bf3514c3d4617ccf42906724baf48e98c201c565d9a5bb5a2a7f1378b5845184"
OS7_CASCADIA_TTF="usr/share/fonts/truetype/cascadia-code/CascadiaMono.ttf"
OS7_CASCADIA_TTF_SHA256="4bac5958d02c6fcf2b9365c5fdf65b9dc3a500a572c80357da7533d9fca9b098"

# THE OUTPUT IS PINNED TOO, and this one is not paranoia — it closes a hole the
# input hashes cannot see. Rasterising an outline font is done by libfreetype,
# and libfreetype is a BUILD CONTAINER package, not an archive-pinned one.
# Measured 2026-08-25: the same TTF through the same script gives 41 different
# glyphs of 409 under libfreetype 2.13.2 than under 2.14.2 — U+0022 goes from
# two one-pixel strokes to a solid block, and most accented capitals shift.
#
# Without this pin, rebuilding the container is enough to change what the
# console looks like while every version number and every input hash stays put,
# which is precisely what release plan 3.1 forbids and what spike S7 measured
# the package set for. Same rule, one layer further down: the number is only
# honest if what it names is fixed.
#
# Architecture is NOT a factor — arm64 and amd64 containers on the same
# libfreetype produce byte-identical PSFs (measured 2026-08-25), so one pair of
# hashes covers both.
#
# These also moved once for a reason that was not libfreetype: glyph POSITION
# 32 has to be blank or `setfont` refuses the font outright (#59), which
# changed the layout and therefore every byte. If these change, know which
# of the two reasons it was.
#
# When libfreetype moves: look at the diff before updating these. If it is the
# hinting engine improving, take it and say so in the commit; if glyphs got
# worse, that is a reason to hold the container back.
OS7_CASCADIA_PSF_SHA256_8x16="1a934fe234cdfa12978a954827097de4402f7ddc432b205fa1a70bbbda2706a2"
OS7_CASCADIA_PSF_SHA256_16x32="9bba6ddd6031fcf06e8351abb745b13a7cf91032242a53d2573da3a76d172728"
