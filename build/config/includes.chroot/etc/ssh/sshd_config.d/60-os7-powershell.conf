# OS/7 — PowerShell over SSH.
#
# WHAT THIS IS NOT. It is not what makes `ssh os7box` land in PowerShell — that
# already happens, and it happens in /etc/profile.d/95-os7-powershell.sh, which
# hands an INTERACTIVE login shell over to pwsh (hook 0050). Measured over a
# real sshd on 2026-08-27: an interactive session reaches `PS /home/os7admin>`
# and `ssh host 'command'` stays in bash, which is what keeps scp, sftp, git and
# rsync working.
#
# WHAT IT IS. The subsystem PowerShell REMOTING speaks — `Enter-PSSession
# -HostName`, `New-PSSession`, `Invoke-Command -HostName`. Those do not run a
# login shell at all: sshd starts this subsystem directly, and without the line
# below they fail with "subsystem request failed on channel 0". PowerShell 7.6
# on this image has the client half already (`Enter-PSSession` and friends are
# present and working); this is the server half, and it was the only thing
# missing.
#
# A DROP-IN AND NOT AN EDIT OF sshd_config. `/etc/ssh/sshd_config` line 24 is
# `Include /etc/ssh/sshd_config.d/*.conf` (measured), openssh owns that file,
# and a package upgrade may replace it. `sshd -T` confirms both subsystems are
# live afterwards — the sftp one is untouched, which matters because losing it
# would break every file copy to this machine.
#
# `-sshs` is `-SSHServerMode` (present in PowerShell 7.6, measured). `-NoLogo`
# keeps the banner out of the protocol stream, which is not cosmetic: remoting
# parses what comes back.

Subsystem powershell /usr/bin/pwsh -sshs -NoLogo
