# OS/7's bench tailnet: a LOCAL control server, so no measurement touches a real
# tailnet (the owner's rule, 2026-11-09). run-tailscale.py copies this file into
# the run's own directory beside a server certificate it made a minute earlier;
# nothing secret is in it, and no key is ever written here.
#
# Headscale 0.29.6. The bench guest (through QEMU's user-mode network, inside a
# Docker Desktop container on the x64 Windows host) and the peer container both
# reach the host as host.docker.internal = 192.168.65.254, which is why that
# address is the relay's and the certificate's (docs/SESSION-TAILSCALE.md §2).
server_url: https://headscale.os7.test:8443
listen_addr: 0.0.0.0:8443
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false
noise:
  # Generated by Headscale on first start, in the run's data directory.
  private_key_path: /var/lib/headscale/noise_private.key
prefixes:
  # Tailscale's own ranges, so VA16 meets the range a real tailnet uses.
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential
derp:
  # The embedded relay and NO Tailscale-operated DERP map: nothing leaves this host.
  server:
    enabled: true
    region_id: 999
    region_code: "os7lab"
    region_name: "OS/7 bench DERP"
    verify_clients: true
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 192.168.65.254
  urls: []
  paths: []
  auto_update_enabled: false
disable_check_updates: true
node:
  # Keys do not expire on their own here; a tagged node's never do (measured).
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
tls_cert_path: /etc/headscale/hs.crt
tls_key_path: /etc/headscale/hs.key
log:
  level: info
  format: text
policy:
  mode: file
  path: /etc/headscale/policy.hujson
dns:
  magic_dns: true
  base_domain: tailnet.os7.test
  # Tailscale's own default ("Override local DNS" off): MagicDNS answers for the
  # tailnet's names and nothing else.
  override_local_dns: false
  nameservers:
    global: []
    split: {}
  search_domains: []
  extra_records: []
unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"
