<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tab icon. The 7 from os7-wordmark.svg, same polygon, scaled into a 64 tile and
  reversed out of the brand orange.

  It is the 7 alone and not the wordmark because the wordmark is 2.4 times as
  wide as it is tall: rendered into a 16px favicon it would be about six pixels
  of cap height, which is illegible. A tile with one figure on it is the shape
  that survives that size, and the 7 is the half of "OS/7" nothing else in a
  browser tab looks like.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="OS/7">
  <title>OS/7</title>
  <rect width="64" height="64" rx="12" fill="#ff6912"/>
  <path transform="translate(-65.07, 9.16) scale(0.664)" fill="#ffffff"
        d="M 124.8 24
           L 124.8 8.8
           L 167.62 8.8
           L 148.42 60
           L 141.58 60
           L 158.38 15.2
           L 131.2 15.2
           L 131.2 24 Z"/>
</svg>
