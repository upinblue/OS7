<?xml version="1.0" encoding="UTF-8"?>
<!--
  OS/7 wordmark.

  DRAWN, NOT SET. Every shape here is geometry authored for this file: an ellipse
  ring, a spine, a parallelogram and a polygon. There is no <text> in it and no
  font behind it, for two reasons that both matter.

  The first is that a wordmark made of live text is not one mark but three: the
  same file renders as Segoe UI Light on Windows, Helvetica Neue Light on macOS
  and DejaVu Sans on a Linux desktop. That was the defect in the placeholder
  this replaces.

  The second is licensing, and it is the reason the obvious fix was not taken.
  Converting the placeholder's Segoe UI Light glyphs to outlines would have
  matched it exactly - and would have put Microsoft font outlines on a public
  website, which that font's licence does not allow. This repository already
  tracks CC0 for Fixedsys, OFL for Cascadia and GPL-3.0+ for sanoid; it does not
  get to be careless here.

  ONE FILE FOR BOTH THEMES. The mark is orange on transparent, so the page shows
  through: near-black on the dark theme, white on the light one. That is the same
  property that lets brand/uib-logo.webp serve both.

  GEOMETRY, and why two of the four shapes are filled rather than stroked.
  Cap height 48 (y 12..60), weight 6.4 measured across the stroke, so the
  weight-to-height ratio is 0.133 - light, which is what the mark is. The O and
  the S are stroked: their terminals are either absent or nearly vertical, and a
  butt cap gives the right cut for free. The SLASH and the 7 are filled
  polygons, because a butt cap is cut perpendicular to the stroke and both of
  those terminals have to be cut HORIZONTALLY. On a stroke this steep the
  difference is about twenty degrees - small enough to miss in the source and
  obvious at 150px.

  Their horizontal weight is therefore wider than 6.4: a 6.4 stroke crossed
  horizontally measures 6.4 x length / rise. For the slash that is 6.91, for the
  diagonal of the 7 it is 6.83.

  The slash breaks the cap line at both ends (y 4..68) deliberately. It is the
  one gesture in the mark that is not aligned to anything, and it is what makes
  the whole read as OS/7 rather than as three letters and a punctuation mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 72" width="170" height="72"
     role="img" aria-label="OS/7">
  <title>OS/7</title>

  <!-- O and S: stroked -->
  <g fill="none" stroke="#ff6912" stroke-width="6.4" stroke-linecap="butt">
    <ellipse cx="21" cy="36" rx="14.8" ry="20.8"/>
    <path d="M 78.4 21.5
             C 78.4 17.2, 72.0 15.2, 64.0 15.2
             C 55.6 15.2, 49.6 18.6, 49.6 24.2
             C 49.6 29.8, 55.6 32.0, 64.0 33.8
             C 72.4 35.6, 78.4 38.2, 78.4 44.4
             C 78.4 50.6, 72.4 56.8, 64.0 56.8
             C 55.6 56.8, 49.6 53.2, 49.6 48.6"/>
  </g>

  <!-- slash and 7: filled, so both terminals are cut horizontally -->
  <g fill="#ff6912">
    <path d="M 88.55 68 L 95.45 68 L 121.45 4 L 114.55 4 Z"/>
    <path d="M 124.8 24
             L 124.8 8.8
             L 167.62 8.8
             L 148.42 60
             L 141.58 60
             L 158.38 15.2
             L 131.2 15.2
             L 131.2 24 Z"/>
  </g>
</svg>
