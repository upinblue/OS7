# =============================================================================
# OS/7 — ISO build CI
#
#   *** THIS FILE HAS NEVER RUN. ITS PREDECESSOR RAN ONCE, AND MEASURED TWO
#       THINGS THIS HISTORY HAD FORGOTTEN. ***
#
# On 2026-06-24, a workflow at `.github/workflows/build.yml` ran on push from
# the history this repository replaced: commit 716be695 is not an object here
# and that file has never existed on any branch here, but GitHub kept the run —
# https://github.com/upinblue/OS7/actions/runs/28103636078. It is the session
# commit e1a63f9 harvested. What it measured:
#
#   * build-arm64 on `ubuntu-24.04-arm` — SUCCEEDED in 15m2s and uploaded an
#     ISO artifact. The label is real, the free native arm64 runner scheduled
#     a job on it, and an OS/7 ISO came out. What is unproven here is THIS
#     FILE, not the runner.
#   * build-amd64 on `ubuntu-24.04` — FAILED in 10m22s, and failed nowhere
#     near where Apple Silicon fails. A native x86_64 runner debootstraps and
#     builds the chroot without the ENOSYS that stops Docker's emulation on
#     this Mac (docs/BUILD-NOTES.md #12). It reached the BINARY stage and died
#     in `lb_binary_memtest`:
#
#         cp: cannot stat 'chroot/boot/.bin': No such file or directory
#
#     That is docs/BUILD-NOTES.md #44 — a live-build defect that only amd64
#     can reach, in a stage OS/7 does not want anything from. Whether it is
#     the LAST amd64 blocker is unknown: nothing has ever run past it.
#
# So amd64 has been attempted natively, and the honest statement is not "never
# tried" but "got through the rootfs and fell over assembling the medium".
#
# Per README.md ("CI"): amd64 on standard hosted runners, arm64 on the free
# NATIVE arm64 hosted runners available to public repos. Nothing here builds
# under QEMU emulation — there is deliberately no setup-qemu-action /
# docker/setup-buildx cross-build step, and none should be added.
#
# Trigger is workflow_dispatch only: no run of THIS file has ever been
# dispatched, so a `push:` trigger would put an unread red X on every push.
# Add `push:` once one dispatched run has gone green.
# =============================================================================

name: build-iso

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-amd64:
    name: ISO (amd64)
    # Standard x86_64 hosted runner — native, no emulation.
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 - the BUILD field of the version is
      # `git rev-list --count HEAD` (RELEASE-AND-UPDATE-PLAN.md §3.3), and the
      # default depth-1 checkout would answer 1 on every run, forever, without
      # anything looking wrong. scripts/os7-source-facts.sh refuses a shallow
      # clone rather than counting one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ISO
        run: make build-amd64

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: os7-amd64-iso
          path: out/*.iso
          if-no-files-found: error

  build-arm64:
    name: ISO (arm64)
    # Free NATIVE arm64 hosted runner for public repos — no QEMU.
    # The label is MEASURED, not assumed: the 2026-06-24 run scheduled on
    # `ubuntu-24.04-arm` and built an arm64 ISO on it in 15m2s. If a
    # `ubuntu-26.04-arm` label exists by build time, prefer it. The runner OS
    # does not need to match the target distribution — live-build bootstraps
    # `resolute` inside the build container regardless.
    runs-on: ubuntu-24.04-arm
    steps:
      # fetch-depth: 0 - see the amd64 job.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ISO
        run: make build-arm64

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: os7-arm64-iso
          path: out/*.iso
          if-no-files-found: error
