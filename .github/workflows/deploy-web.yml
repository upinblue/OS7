# =============================================================================
# OS/7 — publish os7.org
#
# The site is plain HTML and CSS with no build step, so there is nothing here
# but a copy. `skip_app_build: true` is what says so: without it the deploy
# action looks for a package.json, decides the site is a framework it does not
# recognise, and fails on a repository that has no Node in it at all.
#
# It authenticates with a DEPLOYMENT TOKEN and nothing else — no service
# principal, no subscription access, no ability to touch the storage account
# where the ISOs live. Get the token once with:
#
#   az staticwebapp secrets list --name os7-site --resource-group <rg> \
#       --query properties.apiKey -o tsv
#   gh secret set AZURE_STATIC_WEB_APPS_API_TOKEN --repo upinblue/OS7
#
# PATH-FILTERED, because this repository is mostly not a website: a commit that
# touches only build/ or powershell/ has nothing to publish, and a deploy per
# ISO-build commit would spend the Free plan's quota on identical bytes.
#
# WHAT THIS WORKFLOW CANNOT DO, and should not be given the rights to: upload an
# ISO. Images are placed by hand (web/tools/publish-release.py --print-upload)
# because they are the only part of the site that costs money to serve, and the
# moment one goes public should be a decision rather than a push.
# =============================================================================

name: Publish os7.org

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: os7-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      # A preview build on a pull request lands in one of the Free plan's three
      # staging environments and is torn down by the close job below.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'web'
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
