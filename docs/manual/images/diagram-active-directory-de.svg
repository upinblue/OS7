<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Segoe UI, Calibri, system-ui, sans-serif"><rect width="900" height="330" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0057ad"/></marker></defs><rect x="40" y="40" width="400" height="230" rx="6" fill="#eef4fb" stroke="#0057ad" stroke-width="1.5"/><text x="58" y="68" font-size="14" fill="#0057ad" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Verwalten</text><text x="58" y="90" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Kein Domänenbeitritt. Kein Computerkonto. Kein neues Paket.</text><text x="58" y="122" font-size="12" fill="#14181d" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Enter-OS7AdminSession</text><text x="58" y="142" font-size="11" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Get-OS7ADUser · New-OS7ADUser</text><text x="58" y="160" font-size="11" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Add-OS7ADGroupMember · Search-OS7AD</text><text x="58" y="194" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Ein Administrator meldet sich VON dieser</text><text x="58" y="210" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Maschine aus mit dem eigenen AD-Konto an und</text><text x="58" y="226" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">arbeitet als er selbst.</text><text x="58" y="254" font-size="11.5" fill="#0057ad" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">LDAPS 636</text><rect x="460" y="40" width="400" height="230" rx="6" fill="#ffffff" stroke="#5a6570" stroke-width="1.5" stroke-dasharray="5 4"/><text x="478" y="68" font-size="14" fill="#14181d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Mitglied werden</text><text x="478" y="90" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Die Maschine bekommt ein Computerkonto in der Domäne.</text><text x="478" y="122" font-size="12" fill="#14181d" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Join-OS7Domain</text><text x="478" y="142" font-size="11" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Get-/Set-OS7DomainLogonPolicy</text><text x="478" y="160" font-size="11" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Test-OS7Domain · Repair-OS7Domain</text><text x="478" y="194" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Damit können sich Domänenbenutzer an dieser</text><text x="478" y="210" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Maschine anmelden. Setzt adcli und sssd</text><text x="478" y="226" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">voraus.</text><text x="478" y="254" font-size="11.5" fill="#5a6570" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">adcli · sssd · Kerberos</text><text x="40" y="306" font-size="11.5" fill="#14181d" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Die beiden sind unabhängig: Verwalten funktioniert ohne Mitgliedschaft, Mitgliedschaft ohne Verwaltungssitzung.</text></svg>