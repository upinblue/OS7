<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Segoe UI, Calibri, system-ui, sans-serif"><rect width="900" height="340" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0057ad"/></marker></defs><rect x="40" y="40" width="330" height="200" rx="6" fill="#eef4fb" stroke="#0057ad" stroke-width="1.5"/><text x="58" y="66" font-size="13" fill="#0057ad" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Source — this machine</text><text x="58" y="90" font-size="11" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">rpool/USERDATA/&lt;user&gt;</text><text x="58" y="108" font-size="11" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">rpool/DATA/...</text><rect x="58" y="126" width="294" height="44" rx="5" fill="#ffffff" stroke="#c4ccd4" stroke-width="1.1"/><text x="72" y="146" font-size="12" fill="#14181d" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">sanoid</text><text x="72" y="162" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">takes snapshots and thins them</text><rect x="58" y="180" width="294" height="44" rx="5" fill="#ffffff" stroke="#c4ccd4" stroke-width="1.1"/><text x="72" y="200" font-size="12" fill="#14181d" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">syncoid</text><text x="72" y="216" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">replicates with zfs send/receive</text><rect x="530" y="40" width="330" height="200" rx="6" fill="#e9f5ee" stroke="#1f7a4d" stroke-width="1.5"/><text x="548" y="66" font-size="13" fill="#1f7a4d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Target — a pool or an SSH host</text><text x="548" y="90" font-size="11" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Get-/New-OS7BackupTarget</text><text x="548" y="116" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">a local pool on an external disk,</text><text x="548" y="136" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">or a pool on another machine</text><text x="548" y="156" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">over SSH</text><line x1="370" y1="140" x2="528" y2="140" stroke="#0057ad" stroke-width="2" marker-end="url(#a)"/><text x="450" y="130" font-size="11" fill="#0057ad" font-weight="600" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">zfs send</text><rect x="40" y="264" width="820" height="56" rx="6" fill="#fdf3e3" stroke="#e0b968" stroke-width="1.4"/><text x="58" y="288" font-size="12.5" fill="#14181d" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Get-OS7BackupStatus</text><text x="58" y="308" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">asks ZFS on both ends and compares snapshot GUIDs — never sanoid, whose success is not evidence</text><line x1="200" y1="264" x2="200" y2="244" stroke="#0057ad" stroke-width="1.4" marker-end="url(#a)"/><line x1="700" y1="264" x2="700" y2="244" stroke="#0057ad" stroke-width="1.4" marker-end="url(#a)"/></svg>