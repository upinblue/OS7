<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" font-family="Segoe UI, Calibri, system-ui, sans-serif"><rect width="900" height="452" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0057ad"/></marker></defs><text x="40" y="28" font-size="13.5" fill="#14181d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Update-OS7 — the order that is actually performed</text><rect x="40" y="44" width="700" height="38" rx="5" fill="#eef4fb" stroke="#0057ad" stroke-width="1.4"/><text x="58" y="68" font-size="12" fill="#0057ad" font-weight="700" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">1</text><text x="84" y="68" font-size="12" fill="#14181d" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Clone the rpool/ROOT and bpool/BOOT pair</text><line x1="70" y1="82" x2="70" y2="90" stroke="#0057ad" stroke-width="1.3" marker-end="url(#a)"/><rect x="40" y="90" width="700" height="38" rx="5" fill="#ffffff" stroke="#c4ccd4" stroke-width="1.1"/><text x="58" y="114" font-size="12" fill="#0057ad" font-weight="700" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">2</text><text x="84" y="114" font-size="12" fill="#14181d" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Assemble the clone and mount it</text><line x1="70" y1="128" x2="70" y2="136" stroke="#0057ad" stroke-width="1.3" marker-end="url(#a)"/><rect x="40" y="136" width="700" height="38" rx="5" fill="#ffffff" stroke="#c4ccd4" stroke-width="1.1"/><text x="58" y="160" font-size="12" fill="#0057ad" font-weight="700" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">3</text><text x="84" y="160" font-size="12" fill="#14181d" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Point apt inside the clone at both repositories</text><line x1="70" y1="174" x2="70" y2="182" stroke="#0057ad" stroke-width="1.3" marker-end="url(#a)"/><rect x="40" y="182" width="700" height="38" rx="5" fill="#ffffff" stroke="#c4ccd4" stroke-width="1.1"/><text x="58" y="206" font-size="12" fill="#0057ad" font-weight="700" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">4</text><text x="84" y="206" font-size="12" fill="#14181d" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">apt install os7-&lt;mode&gt;=&lt;version&gt;  -&gt;  full-upgrade  -&gt;  autoremove</text><line x1="70" y1="220" x2="70" y2="228" stroke="#0057ad" stroke-width="1.3" marker-end="url(#a)"/><rect x="40" y="228" width="700" height="38" rx="5" fill="#ffffff" stroke="#c4ccd4" stroke-width="1.1"/><text x="58" y="252" font-size="12" fill="#0057ad" font-weight="700" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">5</text><text x="84" y="252" font-size="12" fill="#14181d" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Run the release's migrations (the chroot phase)</text><line x1="70" y1="266" x2="70" y2="274" stroke="#0057ad" stroke-width="1.3" marker-end="url(#a)"/><rect x="40" y="274" width="700" height="38" rx="5" fill="#ffffff" stroke="#c4ccd4" stroke-width="1.1"/><text x="58" y="298" font-size="12" fill="#0057ad" font-weight="700" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">6</text><text x="84" y="298" font-size="12" fill="#14181d" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Rebuild the initramfs, regenerate the menu</text><line x1="70" y1="312" x2="70" y2="320" stroke="#0057ad" stroke-width="1.3" marker-end="url(#a)"/><rect x="40" y="320" width="700" height="38" rx="5" fill="#ffffff" stroke="#c4ccd4" stroke-width="1.1"/><text x="58" y="344" font-size="12" fill="#0057ad" font-weight="700" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">7</text><text x="84" y="344" font-size="12" fill="#14181d" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Activate the new boot environment</text><line x1="70" y1="358" x2="70" y2="366" stroke="#0057ad" stroke-width="1.3" marker-end="url(#a)"/><rect x="40" y="366" width="700" height="38" rx="5" fill="#eef4fb" stroke="#0057ad" stroke-width="1.4"/><text x="58" y="390" font-size="12" fill="#0057ad" font-weight="700" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">8</text><text x="84" y="390" font-size="12" fill="#14181d" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">After the restart: firstboot migrations, prune old environments</text><rect x="760" y="44" width="100" height="360" rx="6" fill="#e9f5ee" stroke="#1f7a4d" stroke-width="1.4"/><text x="772" y="74" font-size="10.5" fill="#1f7a4d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">The running</text><text x="772" y="90" font-size="10.5" fill="#1f7a4d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">environment</text><text x="772" y="106" font-size="10.5" fill="#1f7a4d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">is never</text><text x="40" y="434" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">If a step fails, the running environment is still the active one. There is nothing to undo.</text></svg>