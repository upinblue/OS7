<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Segoe UI, Calibri, system-ui, sans-serif"><rect width="900" height="300" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0057ad"/></marker></defs><rect x="40" y="70" width="266" height="150" rx="6" fill="#ffffff" stroke="#0057ad" stroke-width="1.4"/><text x="56" y="100" font-size="15" fill="#0057ad" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Entra ID</text><text x="56" y="122" font-size="11" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Get-OS7EntraStatus</text><text x="56" y="150" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Kann sich ein Benutzer mit einem</text><text x="56" y="165" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Entra-Konto an dieser Maschine</text><text x="56" y="180" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">anmelden?</text><text x="56" y="206" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">authd · brokers.d</text><line x1="173.0" y1="70" x2="173.0" y2="56" stroke="#0057ad" stroke-width="1.4" marker-end="url(#a)"/><rect x="317" y="70" width="266" height="150" rx="6" fill="#ffffff" stroke="#0057ad" stroke-width="1.4"/><text x="333" y="100" font-size="15" fill="#0057ad" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Intune</text><text x="333" y="122" font-size="11" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Get-OS7IntuneEnrollment</text><text x="333" y="150" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Ist diese Maschine bei Intune</text><text x="333" y="165" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">registriert und meldet sie sich?</text><text x="333" y="206" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">intune-portal</text><line x1="450.0" y1="70" x2="450.0" y2="56" stroke="#0057ad" stroke-width="1.4" marker-end="url(#a)"/><rect x="594" y="70" width="266" height="150" rx="6" fill="#ffffff" stroke="#0057ad" stroke-width="1.4"/><text x="610" y="100" font-size="15" fill="#0057ad" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Azure Arc</text><text x="610" y="122" font-size="11" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Get-OS7ArcStatus</text><text x="610" y="150" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Ist der</text><text x="610" y="165" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Azure-Connected-Machine-Agent</text><text x="610" y="180" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">installiert und verbunden?</text><text x="610" y="206" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">azcmagent</text><line x1="727.0" y1="70" x2="727.0" y2="56" stroke="#0057ad" stroke-width="1.4" marker-end="url(#a)"/><rect x="40" y="20" width="820" height="36" rx="5" fill="#eef4fb" stroke="#0057ad" stroke-width="1.5"/><text x="56" y="44" font-size="13" fill="#0057ad" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Get-OS7ManagementStatus</text><text x="300" y="44" font-size="11.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">beantwortet alle drei in einem Aufruf</text><text x="40" y="254" font-size="11.5" fill="#14181d" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Drei getrennte Wege, drei getrennte Antworten.</text><text x="40" y="274" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Jedes dieser Cmdlets sagt auch, WARUM etwas nicht geht, statt nur "nein" — ein fehlender Broker sieht sonst aus wie</text><text x="40" y="290" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">ein falsches Kennwort.</text></svg>