<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Segoe UI, Calibri, system-ui, sans-serif"><rect width="900" height="380" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0057ad"/></marker></defs><rect x="40" y="40" width="196" height="96" rx="6" fill="#eef4fb" stroke="#0057ad" stroke-width="1.4"/><text x="52" y="66" font-size="11.5" fill="#14181d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Bootumgebungen ansehen</text><text x="52" y="122" font-size="10.5" fill="#0057ad" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Get-OS7BootEnvironment</text><line x1="236" y1="88" x2="244" y2="88" stroke="#0057ad" stroke-width="1.6" marker-end="url(#a)"/><rect x="246" y="40" width="196" height="96" rx="6" fill="#ffffff" stroke="#0057ad" stroke-width="1.4"/><text x="258" y="66" font-size="11.5" fill="#14181d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Neue anlegen und</text><text x="258" y="81" font-size="11.5" fill="#14181d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">befüllen</text><text x="258" y="122" font-size="10.5" fill="#0057ad" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Update-OS7</text><line x1="442" y1="88" x2="450" y2="88" stroke="#0057ad" stroke-width="1.6" marker-end="url(#a)"/><rect x="452" y="40" width="196" height="96" rx="6" fill="#eef4fb" stroke="#0057ad" stroke-width="1.4"/><text x="464" y="66" font-size="11.5" fill="#14181d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Aktiv schalten und neu</text><text x="464" y="81" font-size="11.5" fill="#14181d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">starten</text><text x="464" y="122" font-size="10.5" fill="#0057ad" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Set-OS7BootEnvironment</text><line x1="648" y1="88" x2="656" y2="88" stroke="#0057ad" stroke-width="1.6" marker-end="url(#a)"/><rect x="658" y="40" width="196" height="96" rx="6" fill="#ffffff" stroke="#0057ad" stroke-width="1.4"/><text x="670" y="66" font-size="11.5" fill="#14181d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Zurückrollen, wenn es</text><text x="670" y="81" font-size="11.5" fill="#14181d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">schiefging</text><text x="670" y="122" font-size="10.5" fill="#0057ad" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">Restore-OS7</text><text x="40" y="180" font-size="13" fill="#14181d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Drei Dinge entscheiden, was die Maschine startet — und keines davon ist eine ZFS-Eigenschaft:</text><rect x="40" y="200" width="820" height="50" rx="5" fill="#ffffff" stroke="#c4ccd4" stroke-width="1.2"/><text x="56" y="222" font-size="11.5" fill="#0057ad" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">/etc/grub.d/09_os7-boot-environments</text><text x="56" y="240" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">OS/7 schreibt sein eigenes Menü: ein Eintrag je Bootumgebung</text><rect x="40" y="258" width="820" height="50" rx="5" fill="#ffffff" stroke="#c4ccd4" stroke-width="1.2"/><text x="56" y="280" font-size="11.5" fill="#0057ad" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">EFI: set prefix=($root)/BOOT/&lt;be&gt;@/grub</text><text x="56" y="298" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Eine Datei auf der EFI-Partition sagt, wessen Menü GRUB überhaupt liest</text><rect x="40" y="316" width="820" height="50" rx="5" fill="#ffffff" stroke="#c4ccd4" stroke-width="1.2"/><text x="56" y="338" font-size="11.5" fill="#0057ad" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">grubenv: saved_entry=&lt;entry&gt;</text><text x="56" y="356" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Und saved_entry benennt den Eintrag darin</text><rect x="40" y="378" width="820" height="0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/></svg>