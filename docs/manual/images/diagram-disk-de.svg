<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Calibri, system-ui, sans-serif"><rect width="900" height="470" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0057ad"/></marker></defs><text x="40" y="34" font-size="14" fill="#14181d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Datenträger — installer/SETUP-PLAN.md §4.4</text><rect x="40" y="50" width="150" height="66" rx="5" fill="#fdf3e3" stroke="#e0b968" stroke-width="1.4"/><text x="50" y="72" font-size="11.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">p1  512 MB</text><text x="50" y="92" font-size="13" fill="#14181d" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">FAT32</text><text x="50" y="108" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">/boot/efi</text><rect x="200" y="50" width="150" height="66" rx="5" fill="#fdf3e3" stroke="#e0b968" stroke-width="1.4"/><text x="210" y="72" font-size="11.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">p2  2 GB</text><text x="210" y="92" font-size="13" fill="#14181d" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">ZFS</text><text x="210" y="108" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">bpool</text><rect x="360" y="50" width="500" height="66" rx="5" fill="#eef4fb" stroke="#0057ad" stroke-width="1.4"/><text x="370" y="72" font-size="11.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">p3  Rest</text><text x="370" y="92" font-size="13" fill="#14181d" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">LUKS2</text><text x="370" y="108" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">rpool</text><text x="40" y="134" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">unverschlüsselt — von Intune ignoriert</text><text x="360" y="134" font-size="10.5" fill="#0057ad" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">verschlüsselt (LUKS2 unter ZFS, Entscheidung D3)</text><rect x="40" y="160" width="400" height="176" rx="6" fill="#eef4fb" stroke="#0057ad" stroke-width="1.6"/><text x="56" y="186" font-size="13.5" fill="#0057ad" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">rpool/ROOT/os7_&lt;id&gt;</text><text x="56" y="204" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">IN der Bootumgebung — rollt bei Restore-OS7 mit zurück</text><text x="66" y="228" font-size="11" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">/            das System selbst</text><text x="66" y="248" font-size="11" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">/var/lib/dpkg  die Paketdatenbank</text><text x="66" y="268" font-size="11" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">/var/lib/apt</text><text x="66" y="288" font-size="11" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">/var/cache</text><rect x="40" y="348" width="400" height="44" rx="6" fill="#fdf3e3" stroke="#e0b968" stroke-width="1.4"/><text x="56" y="368" font-size="12" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">bpool/BOOT/os7_&lt;id&gt;  -&gt;  /boot</text><text x="56" y="384" font-size="10.5" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">der Kernel und das initramfs dieser Bootumgebung</text><rect x="470" y="160" width="390" height="232" rx="6" fill="#e9f5ee" stroke="#1f7a4d" stroke-width="1.6"/><text x="486" y="186" font-size="13.5" fill="#1f7a4d" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">rpool/USERDATA · rpool/DATA</text><text x="486" y="204" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">AUSSERHALB — überlebt jeden Rollback</text><text x="496" y="228" font-size="10.5" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">USERDATA/&lt;user&gt;_&lt;uuid&gt;   /home/&lt;user&gt;</text><text x="496" y="248" font-size="10.5" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">USERDATA/root_&lt;uuid&gt;     /root</text><text x="496" y="268" font-size="10.5" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">DATA/log                 /var/log</text><text x="496" y="288" font-size="10.5" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">DATA/spool  DATA/tmp     /var/spool</text><text x="496" y="308" font-size="10.5" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">DATA/srv                 /srv</text><text x="496" y="328" font-size="10.5" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">DATA/lib/&lt;service&gt;       /var/lib/&lt;s&gt;</text><text x="496" y="348" font-size="10.5" fill="#14181d" font-weight="400" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace" letter-spacing="0">DATA/snapd               /var/lib/snapd</text><text x="40" y="424" font-size="12" fill="#14181d" font-weight="600" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Die Regel, die jeden Pfad entscheidet:</text><text x="40" y="444" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">Ein Pfad gehört in die Bootumgebung genau dann, wenn ein Rollback ihn korrekter macht. Zustand, den etwas außerhalb</text><text x="40" y="460" font-size="11" fill="#5a6570" font-weight="400" text-anchor="start" font-family="Segoe UI, Calibri, system-ui, sans-serif" letter-spacing="0">dieser Maschine ebenfalls kennt, bleibt draußen — die Gegenseite rollt nicht zurück.</text></svg>